name: .NET CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: schultzregistry.azurecr.io
          username: ${{ secrets.PROD_ACR_USERNAME }}
          password: ${{ secrets.PROD_ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t schultzregistry.azurecr.io/fetchit-storage-service:latest \
            --push .

      - name: Log out of Azure Container Registry
        run: docker logout schultzregistry.azurecr.io

      - name: Setup Kubernetes config
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply Kubernetes configurations
        run: |
          kubectl apply -f Kubernetes.Configurations/fetchit-storage-service/

      - name: Restart Kubernetes deployment
        run: |
          kubectl rollout restart deployment/storage-service --namespace=fetchit-storage-service
          kubectl rollout status deployment/storage-service --namespace=fetchit-storage-service --timeout=120s
